<title>GoPlan — 访问验证</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", Arial, sans-serif;
    background:#0a0e14; color:#e8edf4; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate {
    width:100%; max-width:380px; background:#111722;
    border:1px solid rgba(255,255,255,.08); border-radius:16px;
    padding:36px 30px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .lock { font-size:2.2rem; margin-bottom:14px; }
  h1 { font-size:1.15rem; margin-bottom:6px; }
  p.sub { font-size:.82rem; color:#8b96a8; margin-bottom:24px; }
  input {
    width:100%; padding:12px 14px; border-radius:10px; font-size:.95rem;
    background:#0a0e14; color:#e8edf4; border:1px solid rgba(255,255,255,.12);
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input:focus { border-color:#4f8cff; box-shadow:0 0 0 3px rgba(79,140,255,.15); }
  button {
    width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#4f8cff,#3a6fe0); color:#fff;
    font-size:.95rem; font-weight:600; cursor:pointer; transition:transform .15s;
  }
  button:hover { transform:translateY(-1px); }
  button:disabled { opacity:.6; cursor:wait; transform:none; }
  .err { color:#ef4444; font-size:.82rem; margin-top:12px; min-height:1.2em; }
  .shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// HTTP 环境下 WebCrypto 不可用，直接提示走 HTTPS
if (!window.isSecureContext) {
  const err = document.getElementById('err');
  err.innerHTML = '当前为 HTTP 访问，解密功能被浏览器禁用。<br>请使用 <a href="https://' + location.host + location.pathname + '" style="color:#4f8cff">HTTPS 地址</a> 访问';
  document.getElementById('btn').disabled = true;
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!window.isSecureContext) return;
  const pwd = document.getElementById('pwd').value;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.textContent = '';
  btn.disabled = true; btn.textContent = '解密中…';
  try {
    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:200000, hash:'SHA-256' },
      keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = '密码错误，请重试';
    const g = document.getElementById('gate');
    g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    btn.disabled = false; btn.textContent = '解锁进入';
    document.getElementById('pwd').select();
  }
});
</script>
